[package]
name = "neocolor"
version = "0.1.0"
# original author: Anton Kulinsky
authors = ["Anton Kulinsky <ankulinsky@gmail.com>", "ODNOGLAZIY <odnoglaziy0git@gmail.com"]
license = "MIT"
description = "Neocolor is a tool for highlighting words in your terminal"
readme = "README.md"
homepage = "https://github.com/odnoglaziy/neocolor"
repository = "https://github.com/odnoglaziy/neocolor"
keywords = ["cli", "highlight", "color", "terminal", "text"]
edition = "2021"
categories = ["command-line-utilities"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ansi_term = "0.12.1"
anyhow = "1.0.75"
clap = { version = "4.4.0", features = ["derive"] }
home = "0.5.5"
regex = "1.9.3"
yaml-rust = "0.4.5"

[profile.release]
lto = "fat"
strip = "debuginfo"
